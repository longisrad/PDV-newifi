name: Build Padavan NEWIFI3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'NEWIFI3.config'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: rt-n56u-src

      - name: Move repository to /opt/rt-n56u
        run: |
          sudo mkdir -p /opt/rt-n56u
          sudo chown -R runner:runner /opt/rt-n56u
          mv rt-n56u-src/* /opt/rt-n56u/ || true
          mv rt-n56u-src/.* /opt/rt-n56u/ 2>/dev/null || true

      - name: Initialize Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man \
            pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Download AdGuardHome binary
        run: |
          AGH_URL=$(curl -s https://api.github.com/repos/AdguardTeam/AdGuardHome/releases/latest \
            | grep "browser_download_url" \
            | grep "mipsle_softfloat.tar.gz" \
            | cut -d '"' -f 4)
          mkdir -p /opt/rt-n56u/trunk/user/adguardhome
          curl -L -o /opt/rt-n56u/trunk/user/adguardhome/AdGuardHome_linux_mipsle_softfloat.tar.gz "$AGH_URL"

      - name: Download CA Certificates
        run: |
          # Bắt buộc phải có cái này để router có thể tải file từ GitHub qua HTTPS
          mkdir -p /opt/rt-n56u/trunk/user/ca-certificates
          curl -L -o /opt/rt-n56u/trunk/user/ca-certificates/ca-certificates.crt https://curl.se/ca/cacert.pem

      - name: Create Tailscale Script
        run: |
          # Tạo file script điều khiển Tailscale và đặt vào folder skeleton của firmware
          # Script này sẽ nằm tại /usr/bin/tailscale.sh khi router chạy
          mkdir -p /opt/rt-n56u/trunk/user/shared/skeleton/usr/bin
          cat << 'EOF' > /opt/rt-n56u/trunk/user/shared/skeleton/usr/bin/tailscale.sh
          #!/bin/sh
          # Script Tailscale: Tải về NAND -> Chạy trên RAM
          
          TS_STORAGE="/etc/storage/tailscale"
          TS_BIN_NAND="$TS_STORAGE/tailscaled"
          TS_RUN="/tmp/tailscale"
          TS_DAEMON="$TS_RUN/tailscaled"
          TS_BIN="$TS_RUN/tailscale"
          TS_SOCK="/tmp/tailscaled.sock"
          TS_PID="/var/run/tailscaled.pid"
          
          # URL binary (mipsle softfloat cho Newifi3)
          TS_URL="https://github.com/lmq8267/tailscale/releases/latest/download/tailscaled_full"

          log() { logger -t "Tailscale" "$1"; }

          setup_binary() {
              mkdir -p "$TS_STORAGE" "$TS_RUN"
              
              # Nếu chưa có binary ở NAND, tải về
              if [ ! -f "$TS_BIN_NAND" ]; then
                  log "Downloading Tailscale binary to NAND..."
                  wget --no-check-certificate -O "$TS_BIN_NAND" "$TS_URL"
                  if [ $? -eq 0 ]; then
                      chmod +x "$TS_BIN_NAND"
                      log "Download successful."
                      /sbin/mtd_storage.sh save
                  else
                      log "Download failed!"
                      return 1
                  fi
              fi

              # Copy sang RAM để chạy
              cp "$TS_BIN_NAND" "$TS_DAEMON"
              chmod +x "$TS_DAEMON"
              ln -sf tailscaled "$TS_BIN"
              return 0
          }

          start() {
              if [ "$(nvram get ts_enable)" != "1" ]; then return; fi
              setup_binary || return 1
              
              # Setup TUN
              mkdir -p /dev/net
              [ ! -c /dev/net/tun ] && mknod /dev/net/tun c 10 200
              modprobe tun 2>/dev/null
              echo 1 > /proc/sys/net/ipv4/ip_forward

              # Start Daemon
              "$TS_DAEMON" --state="$TS_STORAGE/tailscaled.state" --socket="$TS_SOCK" --port=41641 &
              echo $! > "$TS_PID"
              
              sleep 5
              # Connect (Up)
              local ARGS="--reset"
              [ -n "$(nvram get ts_authkey)" ] && ARGS="$ARGS --authkey=$(nvram get ts_authkey)"
              [ "$(nvram get ts_exitnode)" = "1" ] && ARGS="$ARGS --advertise-exit-node"
              
              "$TS_BIN" --socket="$TS_SOCK" up $ARGS
              log "Tailscale started"
          }

          stop() {
              pkill tailscaled
              rm -rf "$TS_RUN"
              log "Tailscale stopped"
          }

          case "$1" in
              start) start ;;
              stop) stop ;;
              restart) stop; start ;;
          esac
          EOF
          chmod +x /opt/rt-n56u/trunk/user/shared/skeleton/usr/bin/tailscale.sh

      - name: Prepare Config
        run: |
          cp -f /opt/rt-n56u/NEWIFI3.config /opt/rt-n56u/trunk/configs/templates/NEWIFI3.config || true
          cp -f /opt/rt-n56u/NEWIFI3.config /opt/rt-n56u/trunk/.config
          cd /opt/rt-n56u/trunk/linux-3.4.x
          make ARCH=mips olddefconfig || (yes "" | make ARCH=mips oldconfig)
          cp -f /opt/rt-n56u/trunk/linux-3.4.x/.config /opt/rt-n56u/trunk/configs/boards/NEWIFI3/kernel-3.4.x.config

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/rt-n56u/toolchain-mipsel/toolchain-3.4.x
          key: ${{ runner.os }}-padavan-toolchain-3.4.x-v1

      - name: Build Toolchain from Source
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd /opt/rt-n56u/toolchain-mipsel
          ./build_toolchain_3.4.x

      - name: Build Firmware
        run: |
          cd /opt/rt-n56u/trunk
          ./clear_tree
          fakeroot ./build_firmware_modify NEWIFI3

      - name: Prepare Release Artifacts
        id: prepare_files
        run: |
          echo "release_tag=NEWIFI3-$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          echo "compile_date=$(date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Padavan-NEWIFI3-Firmware
          path: |
            /opt/rt-n56u/trunk/images/*.trx

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ steps.prepare_files.outputs.release_tag }}
          name: NEWIFI3 Padavan Firmware [${{ steps.prepare_files.outputs.compile_date }}]
          body: |
            ### Padavan Newifi 3 (Tailscale Dynamic Download)
            - **Tailscale:** Tải binary từ GitHub khi khởi động lần đầu.
            - **Lưu trữ:** Binary lưu tại `/etc/storage/tailscale` (NAND).
            - **Vận hành:** Chạy trên RAM (`/tmp/tailscale`) để bảo vệ Flash.
            - **Yêu cầu:** Router cần có kết nối Internet để tải binary trong lần đầu tiên bật Tailscale.
          files: |
            /opt/rt-n56u/trunk/images/*.trx
